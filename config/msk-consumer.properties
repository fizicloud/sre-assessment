# Author:  Hafizi Yahaya
# Created: 2026-11-23
#
# Settlement consumer configuration for msk-tier1-use1 / msk-tier1-usw2.
# Narrative: ../03-resilience.md sections 6.3 and 8, ../04-regional-recovery.md section 4.5.
#
# Identical in both regions. MSK Replicator is configured with identical topic names
# so no consumer configuration changes during a regional failover, which removes a
# configuration step from the critical path. See ../04-regional-recovery.md section 4.5.

bootstrap.servers=b-1.msk-tier1-use1.<...>:9098,b-2.<...>:9098,b-3.<...>:9098
group.id=settlement-consumer

# --- SEC: IAM authentication, TLS in transit ---
security.protocol=SASL_SSL
sasl.mechanism=AWS_MSK_IAM
sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler

# --- Offset management ---
# Manual commit only. Auto-commit acknowledges records before the work is done, so a
# crash loses settlements that the broker believes were handled.
enable.auto.commit=false
auto.offset.reset=earliest

# --- Backpressure. See ../03-resilience.md section 6.3. ---
# max.poll.records bounds how much work one poll admits. Consumers that read as fast as
# the brokers allow pile work into a downstream that cannot accept it, converting a
# provider problem into a queue overflow.
max.poll.records=100
max.poll.interval.ms=300000
fetch.max.bytes=10485760
max.partition.fetch.bytes=1048576

# The consumer PAUSES when the ext-payments circuit breaker is open or when
# sqs-tier1-settlement depth exceeds its threshold, and resumes on recovery.
# MSK is the correct buffer: durable, replayable, designed to hold the backlog.
# Implemented in application code via KafkaConsumer.pause() / resume().

# --- Session and heartbeat ---
session.timeout.ms=45000
heartbeat.interval.ms=3000

# --- Poison message handling. See ../03-resilience.md section 8.1. ---
# After 3 attempts the record is published to sqs-tier1-settlement-dlq with the full
# payload, the error, the topic, the partition and the offset, and the consumer
# COMMITS PAST IT.
#
# Committing past a poison message is the critical behaviour. A consumer that retries a
# permanently failing record forever stalls its partition, and a single stalled
# partition is invisible in SumOffsetLag while being a total outage for every customer
# whose key maps to it. This is why the alarm in ../slo/burn-rate-alarms.tf watches
# MaxOffsetLag per partition instead.
app.poison.max.attempts=3
app.poison.dlq.queue=sqs-tier1-settlement-dlq

# --- Idempotency. See ../03-resilience.md section 4.4. ---
# MSK and SQS are at-least-once. MSK Replicator synchronises consumer offsets
# PERIODICALLY rather than continuously, so after a regional failover consumers may
# reprocess a window of already-handled records.
#
# This is survivable ONLY because consumers are idempotent, keyed on transaction_id.
# Without that property, offset synchronisation would cause duplicate settlement on
# every failover. The two designs are coupled and neither works alone.
app.idempotency.key=transaction_id
app.idempotency.store=ddb-tier1-idempotency

# --- Controlled drain. See ../03-resilience.md section 8.4. ---
# When a backlog has accumulated the instinct is to scale up and drain fast. That is how
# a recovered service is immediately knocked over again, and how a recovering provider is
# pushed straight back into failure.
#   resume at 25% -> hold 5 min -> verify -> 50% -> 75% -> 100%
# Any step that degrades the downstream reverts to the previous rate.
app.drain.initial.rate.percent=25
app.drain.step.percent=25
app.drain.hold.seconds=300

# --- Ordering constraint, stated as design rather than discovered during a replay ---
# Partition key is the account identifier. Per-account ordering holds across a replay.
# CROSS-ACCOUNT ORDERING IS NOT GUARANTEED and no business logic may depend on it.
app.partition.key=account_id

# --- Scaling signal. See ../03-resilience.md section 6.2. ---
# Consumers scale on MSK consumer lag via KEDA, not on CPU. A consumer blocked on a slow
# provider has LOW CPU and HIGH saturation, so CPU-based autoscaling scales down exactly
# when it should scale up.

# Author:  Hafizi Yahaya
# Created: 2026-11-23
#
# Circuit breaking, bulkheads and the timeout ladder for mesh-tier1.
# Narrative: ../03-resilience.md sections 2, 3, 5 and 6.
#
# THE KEY IDEA, because it is easy to configure this wrongly:
#   Envoy outlier detection ejects on consecutive errors and on success-rate deviation.
#   It does NOT eject on latency alone. A dependency that is SLOW but returns 200
#   therefore never trips an error-based breaker, which is exactly the failure mode that
#   caused the stated retry-storm incidents.
#   The per-try TIMEOUT is what converts slowness into a local-origin failure (504) that
#   outlier detection can then see. Timeouts and circuit breaking are one control, not two.
#   See ../03-resilience.md section 5.2.
---
# ============================================================================
# CUJ-4 submit path. Timeout ladder derived INWARD from the p99 objective of
# 2.0s, not outward from each service's default maximum.
#
#   client 5s > cloudfront 5s > apigw 4s > mesh 3.5s > handler 3s
#            > aurora 1.5s > dynamodb 300ms
#
# Each value is strictly below the one above it. A callee whose timeout exceeds
# its caller's means the caller abandons work the callee is still doing: the work
# is wasted, the resource stays held, and the caller usually retries.
# ============================================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: transaction-service
  namespace: tier1
spec:
  hosts: [transaction-service]
  http:
    - route:
        - destination: { host: transaction-service }
      timeout: 3.5s
      retries:
        attempts: 2            # The mesh is ONE of only two retrying layers.
        perTryTimeout: 1.5s    # The sensor. See the header note.
        retryOn: connect-failure,refused-stream,unavailable,gateway-error
        # NOT retriable: 400, 401, 403, 404, 409, 422. Deterministic failures.
        # A retry fails identically and costs the dependency real work.
        retryRemoteLocalities: false
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: transaction-service
  namespace: tier1
spec:
  host: transaction-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 500ms
        tcpKeepalive: { time: 7200s, interval: 75s }
      http:
        # THE most important value in this file. Envoy's pending-request queue is
        # effectively unbounded by default, which turns an overload into a latency
        # collapse, then memory exhaustion, then a crash that drops every queued
        # request. Bounding it turns the same overload into a 503 in milliseconds.
        # See ../03-resilience.md section 1.3 and 6.1.
        http1MaxPendingRequests: 50
        http2MaxRequests: 200
        maxRequestsPerConnection: 100
        maxRetries: 20          # Absolute cap on CONCURRENT retries, cluster-wide.
                                # A per-request retry count gives no system-level
                                # protection: 10,000 clients each retrying twice is
                                # still 20,000 extra requests. See section 3.2.
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 5   # Catches the 504s generated by perTryTimeout.
      interval: 10s
      baseEjectionTime: 30s
      # maxEjectionPercent defaults to 10 and is frequently raised to 100 on the
      # reasoning that unhealthy hosts should always be removed. That produces a
      # specific severe failure: during a WIDESPREAD dependency problem every host
      # fails, every host is ejected, and the service has zero capacity. A partial
      # outage becomes a total one, caused by the control meant to prevent it.
      # See ../03-resilience.md section 5.4.
      maxEjectionPercent: 50
      minHealthPercent: 40
---
# ============================================================================
# BULKHEADS. Section 1.2 of 03-resilience.md shows, via Little's Law, that a slow
# dependency on a SHARED pool reduces effective capacity by ~14x with no errors
# reported anywhere. If one pool served both Aurora and ext-payments, a slow
# provider would starve database access and take down journeys that never touch
# the provider. That is how one dependency caused a regional incident.
#
# Each dependency gets its own bounded pool. The ext-payments pool is deliberately
# tiny and exists ONLY in the settlement consumer, so it is not merely bounded, it
# is absent from the customer-facing path entirely.
# ============================================================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ext-payments-egress
  namespace: tier1
spec:
  host: ext-payments.provider.example
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10      # Per pod. Enough for async settlement throughput,
                                # far too few to exhaust anything else.
        connectTimeout: 1s
      http:
        http1MaxPendingRequests: 5
        maxRequestsPerConnection: 50
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 3
      consecutiveGatewayErrors: 3
      interval: 10s
      baseEjectionTime: 60s
      maxEjectionPercent: 100   # Safe to zero out HERE, and only here: ejecting the
                                # provider entirely is the desired behaviour. Work
                                # queues durably in MSK and CUJ-4 stays available.
    tls: { mode: SIMPLE }       # SEC: TLS to the provider, cert pinned to its CA.
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ext-idp-egress
  namespace: tier1
spec:
  host: ext-idp.provider.example
  trafficPolicy:
    connectionPool:
      tcp: { maxConnections: 5, connectTimeout: 1s }   # JWKS refresh only.
      http: { http1MaxPendingRequests: 2, maxRetries: 2 }
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 60s
      maxEjectionPercent: 100
---
# ============================================================================
# Retry budget as a PERCENTAGE of active requests. Istio does not expose
# retry_budget natively, so it is set on the Envoy cluster circuit breaker.
# Retries shrink automatically as failures spread, which a fixed count never does.
# Starting value, calibrated in the first 30 days. See ../07-validation-limitations.md.
# ============================================================================
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: retry-budget-tier1
  namespace: tier1
spec:
  configPatches:
    - applyTo: CLUSTER
      match:
        context: SIDECAR_OUTBOUND
      patch:
        operation: MERGE
        value:
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                retry_budget:
                  budget_percent: { value: 10.0 }   # Retries <= 10% of active requests.
                  min_retry_concurrency: 3
---
# ============================================================================
# SEC: mesh-wide strict mTLS. Every pod-to-pod call is mutually authenticated.
# ============================================================================
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: tier1
spec:
  mtls: { mode: STRICT }
---
# Pod Disruption Budget. Three replicas on nodes that happen to share an AZ provides
# the appearance of redundancy and none of the substance, so the topology spread
# constraint matters as much as the PDB. See ../03-resilience.md section 9.2.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transaction-service
  namespace: tier1
spec:
  minAvailable: 67%
  selector:
    matchLabels: { app: transaction-service }
